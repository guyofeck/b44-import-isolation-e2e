services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: ["node", "--watch", "server.mjs"]
    environment:
      - BASE44_SANDBOX
      - BASE44_SANDBOX_HOST_DOMAIN
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ | grep -q 'Public isolation fixture' || (echo 'web: page check failed' && exit 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
